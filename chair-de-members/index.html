<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Stuhlübungen für Senioren — Mitgliederbereich</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="core.css?v=chair-real-videos-20261014-v1">
</head>

<body>

    <!-- ============ PRE-PAGE WELCOME SCREEN ============ -->
    <div id="pre-page" class="pre-page-overlay">
        <div class="pre-page-bg"></div>
        <div class="pre-page-content">
            <div class="pre-page-icon">🪑</div>
            <h1>Stuhlübungen für Senioren</h1>
            <p>Ihr Zugang ist bestätigt. Entdecken Sie Ihre Materialien für Bewegung, Kraft und Beweglichkeit im Sitzen.</p>
            <div class="pre-page-features">
                <span>📖 Bücher</span>
                <span>🎥 Videos</span>
                <span>💬 Hilfe</span>
            </div>
            <button type="button" id="enter-members">
                Zu Ihren Materialien →
            </button>
        </div>
    </div>

    <div id="floating-help-container"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-logo">
                <img src="assets/covers/ch_IMG1_de.png" alt="Stuhlübungen für Senioren" id="brand-logo" onerror="this.style.display='none'">
                <h1 id="brand-title">Stuhlübungen für Senioren</h1>
            </div>
        </header>

        <main id="app-root" class="main-content" tabindex="-1">
            <div class="loader-container">
                <i data-lucide="loader-2" class="spin-icon"></i>
            </div>
        </main>

        <nav class="bottom-tab-bar" id="main-nav" aria-label="Mitgliederbereich">
            <a href="#buecher" class="tab-item" data-tab="buecher">
                <i data-lucide="book-open"></i>
                <span>Bücher</span>
            </a>
            <a href="#videos" class="tab-item" data-tab="videos">
                <i data-lucide="play-circle"></i>
                <span>Videos</span>
            </a>
            <a href="#hilfe" class="tab-item" data-tab="hilfe">
                <i data-lucide="message-square"></i>
                <span>Hilfe</span>
            </a>
        </nav>
    </div>

    <script src="data.js?v=chair-real-videos-20261014-v1"></script>
    <script src="video-section.js?v=chair-real-videos-20261014-v1"></script>
    <script src="app.js?v=chair-real-videos-20261014-v1"></script>
