name: Publish Cross Stitch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cross-stitch-members.yml'
      - 'cross-stitch-da-members/**'
      - 'cross-stitch-de-members/**'
      - 'cross-stitch-es-members/**'
      - 'cross-stitch-fi-members/**'
      - 'cross-stitch-fr-members/**'
      - 'cross-stitch-it-members/**'
      - 'cross-stitch-nl-members/**'
      - 'cross-stitch-no-members/**'
      - 'cross-stitch-pl-members/**'
      - 'cross-stitch-sv-members/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cross-stitch-members
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout Cross Stitch member areas
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 2
          sparse-checkout: |
            cross-stitch-da-members
            cross-stitch-de-members
            cross-stitch-es-members
            cross-stitch-fi-members
            cross-stitch-fr-members
            cross-stitch-it-members
            cross-stitch-nl-members
            cross-stitch-no-members
            cross-stitch-pl-members
            cross-stitch-sv-members

      - name: Select changed member areas
        id: areas
        shell: bash
        run: |
          set -euo pipefail
          all_sources='cross-stitch-da-members cross-stitch-de-members cross-stitch-es-members cross-stitch-fi-members cross-stitch-fr-members cross-stitch-it-members cross-stitch-nl-members cross-stitch-no-members cross-stitch-pl-members cross-stitch-sv-members'
          before='${{ github.event.before }}'
          sources=''
          if [ '${{ github.event_name }}' = 'push' ] && [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]]; then
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$before"
            fi
            changed="$(git diff --name-only "$before" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)"
            for source in $all_sources; do
              if printf '%s\n' "$changed" | grep -Fxq "$source"; then
                sources="$sources $source"
              fi
            done
          fi
          if [ -z "$sources" ]; then sources="$all_sources"; fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Download original PDFs
        shell: bash
        timeout-minutes: 20
        env:
          SOURCES: ${{ steps.areas.outputs.sources }}
        run: |
          set -euo pipefail
          for source in $SOURCES; do
          for pdf in "$source"/materials/*.pdf; do
            expected="$(awk '$1 == "oid" { sub(/^sha256:/, "", $2); print $2 }' "$pdf")"
            if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid LFS reference: $pdf"
              exit 1
            fi
            curl --http1.1 --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              "https://media.githubusercontent.com/media/$GITHUB_REPOSITORY/$GITHUB_SHA/$pdf" \
              --output "$pdf.download"
            actual="$(shasum -a 256 "$pdf.download" | awk '{print $1}')"
            if [ "$actual" != "$expected" ] || [ "$(head -c 5 "$pdf.download")" != '%PDF-' ]; then
              echo "::error::Original PDF integrity check failed: $pdf"
              exit 1
            fi
            mv "$pdf.download" "$pdf"
          done
          done

      - name: Publish selected member areas using SSH
        shell: bash
        env:
          SOURCES: ${{ steps.areas.outputs.sources }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SECRET: ${{ secrets.VPS_SECRET }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$VPS_USERNAME" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/member-ssh.XXXXXX")"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$VPS_SECRET" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 20 -H "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          remote="$VPS_USERNAME@$VPS_HOST"
          for source in $SOURCES; do
          locale="${source#cross-stitch-}"
          locale="${locale%-members}"
          case "$locale" in
            da|de|es|fi|fr|it|nl|no|pl|sv) ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$source.tar.gz"
          remote_archive="/tmp/$source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          destination="/var/www/skillvault.blog/cross-stitch-$locale-m"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$source" .
          scp "${ssh_options[@]}" "$archive" "$remote:$remote_archive"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$remote_archive" "$destination" "$VPS_USERNAME" <<'REMOTE'
          set -euo pipefail
          archive="$1"
          destination="$2"
          owner="$3"
          case "$destination" in
            /var/www/skillvault.blog/cross-stitch-da-m|/var/www/skillvault.blog/cross-stitch-de-m|/var/www/skillvault.blog/cross-stitch-es-m|/var/www/skillvault.blog/cross-stitch-fi-m|/var/www/skillvault.blog/cross-stitch-fr-m|/var/www/skillvault.blog/cross-stitch-it-m|/var/www/skillvault.blog/cross-stitch-nl-m|/var/www/skillvault.blog/cross-stitch-no-m|/var/www/skillvault.blog/cross-stitch-pl-m|/var/www/skillvault.blog/cross-stitch-sv-m) ;;
            *) exit 1 ;;
          esac
          case "$archive" in
            /tmp/cross-stitch-da-members-*.tar.gz|/tmp/cross-stitch-de-members-*.tar.gz|/tmp/cross-stitch-es-members-*.tar.gz|/tmp/cross-stitch-fi-members-*.tar.gz|/tmp/cross-stitch-fr-members-*.tar.gz|/tmp/cross-stitch-it-members-*.tar.gz|/tmp/cross-stitch-nl-members-*.tar.gz|/tmp/cross-stitch-no-members-*.tar.gz|/tmp/cross-stitch-pl-members-*.tar.gz|/tmp/cross-stitch-sv-members-*.tar.gz) ;;
            *) exit 1 ;;
          esac
          sudo mkdir -p "$destination"
          sudo tar -xzf "$archive" -C "$destination"
          sudo chown -R "$owner:$(id -gn "$owner")" "$destination"
          sudo find "$destination" -type d -exec chmod 755 {} +
          sudo find "$destination" -type f -exec chmod 644 {} +
          rm -f "$archive"
          REMOTE
          done
