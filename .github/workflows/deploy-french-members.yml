name: Publish French Learning Members

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-french-members.yml'
      - 'french-de-members/**'
      - 'french-es-members/**'
      - 'french-nl-members/**'
      - 'french-it-members/**'
      - 'french-pl-members/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-french-members
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        language: [de, es, nl, it, pl]
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      SOURCE: french-${{ matrix.language }}-members
    steps:
      - name: Checkout member area
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout: french-${{ matrix.language }}-members

      - name: Download original PDFs
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          for pdf in "$SOURCE"/materials/*.pdf; do
            expected="$(awk '$1 == "oid" { sub(/^sha256:/, "", $2); print $2 }' "$pdf")"
            if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid LFS reference: $pdf"
              exit 1
            fi
            curl --http1.1 --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              "https://media.githubusercontent.com/media/$GITHUB_REPOSITORY/$GITHUB_SHA/$pdf" \
              --output "$pdf.download"
            actual="$(shasum -a 256 "$pdf.download" | awk '{print $1}')"
            if [ "$actual" != "$expected" ] || [ "$(head -c 5 "$pdf.download")" != '%PDF-' ]; then
              echo "::error::Original PDF integrity check failed: $pdf"
              exit 1
            fi
            mv "$pdf.download" "$pdf"
          done

      - name: Publish member area using SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SECRET: ${{ secrets.VPS_SECRET }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            french-de-members) destination='/var/www/skillvault.blog/french-de-m' ;;
            french-es-members) destination='/var/www/skillvault.blog/french-es-m' ;;
            french-nl-members) destination='/var/www/skillvault.blog/french-nl-m' ;;
            french-it-members) destination='/var/www/skillvault.blog/french-it-m' ;;
            french-pl-members) destination='/var/www/skillvault.blog/french-pl-m' ;;
            *) exit 1 ;;
          esac
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$VPS_USERNAME" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/member-ssh.XXXXXX")"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$VPS_SECRET" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 20 -H "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          remote="$VPS_USERNAME@$VPS_HOST"
          archive="$RUNNER_TEMP/$SOURCE.tar.gz"
          remote_archive="/tmp/$SOURCE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$SOURCE" .
          scp "${ssh_options[@]}" "$archive" "$remote:$remote_archive"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$remote_archive" "$destination" "$VPS_USERNAME" <<'REMOTE'
          set -euo pipefail
          archive="$1"
          destination="$2"
          owner="$3"
          case "$destination" in
            /var/www/skillvault.blog/french-de-m|/var/www/skillvault.blog/french-es-m|/var/www/skillvault.blog/french-nl-m|/var/www/skillvault.blog/french-it-m|/var/www/skillvault.blog/french-pl-m) ;;
            *) exit 1 ;;
          esac
          case "$archive" in
            /tmp/french-de-members-*.tar.gz|/tmp/french-es-members-*.tar.gz|/tmp/french-nl-members-*.tar.gz|/tmp/french-it-members-*.tar.gz|/tmp/french-pl-members-*.tar.gz) ;;
            *) exit 1 ;;
          esac
          sudo mkdir -p "$destination"
          sudo tar -xzf "$archive" -C "$destination"
          sudo chown -R "$owner:$(id -gn "$owner")" "$destination"
          sudo find "$destination" -type d -exec chmod 755 {} +
          sudo find "$destination" -type f -exec chmod 644 {} +
          rm -f "$archive"
          REMOTE
