name: Publish Crochet

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-croche.yml'
      - 'croche-de-members/**'
      - 'croche-da-members/**'
      - 'croche-es-members/**'
      - 'croche-fr-members/**'
      - 'croche-nl-members/**'
      - 'croche-it-members/**'
      - 'croche-no-members/**'
      - 'croche-pl-members/**'
      - 'croche-sv-members/**'
      - 'croche-cs-members/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-croche
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout member areas
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 2
          sparse-checkout: |
            croche-de-members
            croche-da-members
            croche-es-members
            croche-fr-members
            croche-nl-members
            croche-it-members
            croche-no-members
            croche-pl-members
            croche-sv-members
            croche-cs-members

      - name: Select member areas to publish
        id: areas
        shell: bash
        run: |
          set -euo pipefail
          all_sources='croche-de-members croche-da-members croche-es-members croche-fr-members croche-nl-members croche-it-members croche-no-members croche-pl-members croche-sv-members croche-cs-members'
          before='${{ github.event.before }}'
          sources=''
          if [ '${{ github.event_name }}' = 'push' ] && [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]]; then
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$before"
            fi
            changed="$(git diff --name-only "$before" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)"
            for source in $all_sources; do
              if printf '%s\n' "$changed" | grep -Fxq "$source"; then
                sources="$sources $source"
              fi
            done
          fi
          if [ -z "$sources" ]; then sources="$all_sources"; fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Download the original PDF files
        shell: bash
        timeout-minutes: 10
        env:
          SOURCES: ${{ steps.areas.outputs.sources }}
        run: |
          set -euo pipefail
          for source in $SOURCES; do
          for pdf in "$source"/materials/*.pdf; do
            expected="$(awk '$1 == "oid" { sub(/^sha256:/, "", $2); print $2 }' "$pdf")"
            if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid LFS reference: $pdf"
              exit 1
            fi
            curl --http1.1 --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
              "https://media.githubusercontent.com/media/$GITHUB_REPOSITORY/$GITHUB_SHA/$pdf" \
              --output "$pdf.download"
            actual="$(shasum -a 256 "$pdf.download" | awk '{print $1}')"
            if [ "$actual" != "$expected" ] || [ "$(head -c 5 "$pdf.download")" != '%PDF-' ]; then
              echo "::error::Original PDF integrity check failed: $pdf"
              exit 1
            fi
            mv "$pdf.download" "$pdf"
          done
          done

      - name: Publish selected member areas using SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SECRET: ${{ secrets.VPS_SECRET }}
          SOURCES: ${{ steps.areas.outputs.sources }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$VPS_USERNAME" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/member-ssh.XXXXXX")"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$VPS_SECRET" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 20 -H "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          remote="$VPS_USERNAME@$VPS_HOST"

          for source in $SOURCES; do
            case "$source" in
              croche-de-members) destination='/var/www/skillvault.blog/croche-de-m' ;;
              croche-da-members) destination='/var/www/skillvault.blog/croche-da-m' ;;
              croche-es-members) destination='/var/www/skillvault.blog/croche-es-m' ;;
              croche-fr-members) destination='/var/www/skillvault.blog/croche-fr-m' ;;
              croche-nl-members) destination='/var/www/skillvault.blog/croche-nl-m' ;;
              croche-it-members) destination='/var/www/skillvault.blog/croche-it-m' ;;
              croche-no-members) destination='/var/www/skillvault.blog/croche-no-m' ;;
              croche-pl-members) destination='/var/www/skillvault.blog/croche-pl-m' ;;
              croche-sv-members) destination='/var/www/skillvault.blog/croche-sv-m' ;;
              croche-cs-members) destination='/var/www/skillvault.blog/croche-cs-m' ;;
              *) exit 1 ;;
            esac
            archive="$RUNNER_TEMP/$source.tar.gz"
            remote_archive="/tmp/$source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C "$source" .
            scp "${ssh_options[@]}" "$archive" "$remote:$remote_archive"
            ssh "${ssh_options[@]}" "$remote" bash -s -- "$remote_archive" "$destination" "$VPS_USERNAME" <<'REMOTE'
          set -euo pipefail
          archive="$1"
          destination="$2"
          owner="$3"
          case "$destination" in
            /var/www/skillvault.blog/croche-de-m|/var/www/skillvault.blog/croche-da-m|/var/www/skillvault.blog/croche-es-m|/var/www/skillvault.blog/croche-fr-m|/var/www/skillvault.blog/croche-nl-m|/var/www/skillvault.blog/croche-it-m|/var/www/skillvault.blog/croche-no-m|/var/www/skillvault.blog/croche-pl-m|/var/www/skillvault.blog/croche-sv-m|/var/www/skillvault.blog/croche-cs-m) ;;
            *) exit 1 ;;
          esac
          case "$archive" in
            /tmp/croche-de-members-*.tar.gz|/tmp/croche-da-members-*.tar.gz|/tmp/croche-es-members-*.tar.gz|/tmp/croche-fr-members-*.tar.gz|/tmp/croche-nl-members-*.tar.gz|/tmp/croche-it-members-*.tar.gz|/tmp/croche-no-members-*.tar.gz|/tmp/croche-pl-members-*.tar.gz|/tmp/croche-sv-members-*.tar.gz|/tmp/croche-cs-members-*.tar.gz) ;;
            *) exit 1 ;;
          esac
          sudo mkdir -p "$destination"
          sudo tar -xzf "$archive" -C "$destination"
          sudo chown -R "$owner:$(id -gn "$owner")" "$destination"
          sudo find "$destination" -type d -exec chmod 755 {} +
          sudo find "$destination" -type f -exec chmod 644 {} +
          rm -f "$archive"
          REMOTE
            echo "Published $source"
          done
