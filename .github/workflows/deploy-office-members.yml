name: Publish Office

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-office-members.yml'
      - 'office-cs-members/**'
      - 'office-da-members/**'
      - 'office-de-members/**'
      - 'office-es-members/**'
      - 'office-fi-members/**'
      - 'office-fr-members/**'
      - 'office-hu-members/**'
      - 'office-it-members/**'
      - 'office-nl-members/**'
      - 'office-no-members/**'
      - 'office-pl-members/**'
      - 'office-pt-members/**'
      - 'office-ro-members/**'
      - 'office-sk-members/**'
      - 'office-sv-members/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-office-members
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout Office member areas
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 2
          sparse-checkout: |
            office-cs-members
            office-da-members
            office-de-members
            office-es-members
            office-fi-members
            office-fr-members
            office-hu-members
            office-it-members
            office-nl-members
            office-no-members
            office-pl-members
            office-pt-members
            office-ro-members
            office-sk-members
            office-sv-members

      - name: Select changed member areas
        id: areas
        shell: bash
        run: |
          set -euo pipefail
          all_sources='office-cs-members office-da-members office-de-members office-es-members office-fi-members office-fr-members office-hu-members office-it-members office-nl-members office-no-members office-pl-members office-pt-members office-ro-members office-sk-members office-sv-members'
          before='${{ github.event.before }}'
          sources=''
          if [ '${{ github.event_name }}' = 'push' ] && [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]]; then
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$before"
            fi
            changed="$(git diff --name-only "$before" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)"
            for source in $all_sources; do
              if printf '%s\n' "$changed" | grep -Fxq "$source"; then
                sources="$sources $source"
              fi
            done
          fi
          if [ -z "$sources" ]; then sources="$all_sources"; fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Download original PDFs
        shell: bash
        timeout-minutes: 20
        env:
          SOURCES: ${{ steps.areas.outputs.sources }}
        run: |
          set -euo pipefail
          for source in $SOURCES; do
          for pdf in "$source"/materials/*.pdf; do
            expected="$(awk '$1 == "oid" { sub(/^sha256:/, "", $2); print $2 }' "$pdf")"
            if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid LFS reference: $pdf"
              exit 1
            fi
            curl --http1.1 --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              "https://media.githubusercontent.com/media/$GITHUB_REPOSITORY/$GITHUB_SHA/$pdf" \
              --output "$pdf.download"
            actual="$(shasum -a 256 "$pdf.download" | awk '{print $1}')"
            if [ "$actual" != "$expected" ] || [ "$(head -c 5 "$pdf.download")" != '%PDF-' ]; then
              echo "::error::Original PDF integrity check failed: $pdf"
              exit 1
            fi
            mv "$pdf.download" "$pdf"
          done
          done

      - name: Publish selected member areas using SSH
        shell: bash
        env:
          SOURCES: ${{ steps.areas.outputs.sources }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SECRET: ${{ secrets.VPS_SECRET }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$VPS_USERNAME" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/member-ssh.XXXXXX")"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$VPS_SECRET" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 20 -H "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          remote="$VPS_USERNAME@$VPS_HOST"
          for source in $SOURCES; do
          locale="${source#office-}"
          locale="${locale%-members}"
          case "$locale" in
            cs|da|de|es|fi|fr|hu|it|nl|no|pl|pt|ro|sk|sv) ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$source.tar.gz"
          remote_archive="/tmp/$source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          destination="/var/www/skillvault.blog/office-$locale-m"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$source" .
          scp "${ssh_options[@]}" "$archive" "$remote:$remote_archive"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$remote_archive" "$destination" "$VPS_USERNAME" <<'REMOTE'
          set -euo pipefail
          archive="$1"
          destination="$2"
          owner="$3"
          case "$destination" in
            /var/www/skillvault.blog/office-cs-m|/var/www/skillvault.blog/office-da-m|/var/www/skillvault.blog/office-de-m|/var/www/skillvault.blog/office-es-m|/var/www/skillvault.blog/office-fi-m|/var/www/skillvault.blog/office-fr-m|/var/www/skillvault.blog/office-hu-m|/var/www/skillvault.blog/office-it-m|/var/www/skillvault.blog/office-nl-m|/var/www/skillvault.blog/office-no-m|/var/www/skillvault.blog/office-pl-m|/var/www/skillvault.blog/office-pt-m|/var/www/skillvault.blog/office-ro-m|/var/www/skillvault.blog/office-sk-m|/var/www/skillvault.blog/office-sv-m) ;;
            *) exit 1 ;;
          esac
          case "$archive" in
            /tmp/office-cs-members-*.tar.gz|/tmp/office-da-members-*.tar.gz|/tmp/office-de-members-*.tar.gz|/tmp/office-es-members-*.tar.gz|/tmp/office-fi-members-*.tar.gz|/tmp/office-fr-members-*.tar.gz|/tmp/office-hu-members-*.tar.gz|/tmp/office-it-members-*.tar.gz|/tmp/office-nl-members-*.tar.gz|/tmp/office-no-members-*.tar.gz|/tmp/office-pl-members-*.tar.gz|/tmp/office-pt-members-*.tar.gz|/tmp/office-ro-members-*.tar.gz|/tmp/office-sk-members-*.tar.gz|/tmp/office-sv-members-*.tar.gz) ;;
            *) exit 1 ;;
          esac
          sudo mkdir -p "$destination"
          sudo tar -xzf "$archive" -C "$destination"
          sudo chown -R "$owner:$(id -gn "$owner")" "$destination"
          sudo find "$destination" -type d -exec chmod 755 {} +
          sudo find "$destination" -type f -exec chmod 644 {} +
          rm -f "$archive"
          REMOTE
          done
