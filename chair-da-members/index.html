<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Stolegymnastik for Seniorer — Medlemsområde</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="core.css?v=chair-real-videos-20261014-v1">
</head>

<body>

    <!-- ============ PRE-PAGE WELCOME SCREEN ============ -->
    <div id="pre-page" class="pre-page-overlay">
        <div class="pre-page-bg"></div>
        <div class="pre-page-content">
            <div class="pre-page-icon">🪑</div>
            <h1>Stolegymnastik for Seniorer</h1>
            <p>Din premium adgang er bekræftet.<br>Alt hvad du behøver for styrke, smidighed og velvære derhjemme.</p>
            <div class="pre-page-features">
                <span>📖 Bøger</span>
                <span>🎥 Videoer</span>
                <span>💬 Support</span>
            </div>
            <button onclick="let el=document.getElementById('pre-page'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',600);">
                Adgang til materialer →
            </button>
        </div>
    </div>

    <div id="floating-help-container"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-logo">
                <img src="assets/covers/ch_IMG1_da.png" alt="Logo" id="brand-logo" onerror="this.style.display='none'">
                <h1 id="brand-title"></h1>
            </div>
        </header>

        <main id="app-root" class="main-content" tabindex="-1">
            <div class="loader-container">
                <i data-lucide="loader-2" class="spin-icon"></i>
            </div>
        </main>

        <nav class="bottom-tab-bar" id="main-nav">
            <a href="#livros" class="tab-item" data-tab="livros">
                <i data-lucide="book-open"></i>
                <span>Bøger</span>
            </a>
            <a href="#videos" class="tab-item" data-tab="videos">
                <i data-lucide="play-circle" aria-hidden="true"></i><span>Videoer</span>
            </a>
            <a href="#contato" class="tab-item" data-tab="contato">
                <i data-lucide="message-square"></i>
                <span>Support</span>
            </a>
        </nav>
    </div>

    <script src="data.js?v=chair-real-videos-20261014-v1"></script>
    <script src="video-section.js?v=chair-real-videos-20261014-v1"></script>
    <script src="app.js?v=chair-real-videos-20261014-v1"></script>

</body>
<!-- Deploy v1.0.0 -->
</html>
