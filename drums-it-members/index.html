<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>La Collezione Completa di Batteria — Area membri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="core.css?v=3">
</head>

<body>

    <!-- ============ PRE-PAGE WELCOME SCREEN ============ -->
    <div id="pre-page" class="pre-page-overlay">
        <div class="pre-page-bg"></div>
        <div class="pre-page-content">
            <div class="pre-page-icon">🥁</div>
            <h1>La Collezione Completa di Batteria</h1>
            <p>Il tuo accesso premium è confermato.<br>Inizia oggi il tuo percorso alla batteria e scopri nuovi ritmi.</p>
            <div class="pre-page-features">
                <span>📖 Libri</span>
                <span>💬 Assistenza</span>
            </div>
            <button onclick="let el=document.getElementById('pre-page'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',600);">
                Accedi ai materiali →
            </button>
        </div>
    </div>

    <div id="floating-help-container"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-logo">
                <img src="assets/covers/batera_IMG1_it.png" alt="La Collezione Completa di Batteria" id="brand-logo" onerror="this.style.display='none'">
                <h1 id="brand-title"></h1>
            </div>
        </header>

        <main id="app-root" class="main-content">
            <div class="loader-container">
                <i data-lucide="loader-2" class="spin-icon"></i>
            </div>
        </main>

        <nav class="bottom-tab-bar" id="main-nav">
            <a href="#libri" class="tab-item" data-tab="libri">
                <i data-lucide="book-open"></i>
                <span>Libri</span>
            </a>
            <a href="#assistenza" class="tab-item" data-tab="assistenza">
                <i data-lucide="message-square"></i>
                <span>Assistenza</span>
            </a>
        </nav>
    </div>

    <script src="data.js?v=3"></script>
    <script src="app.js?v=3"></script>

</body>
<!-- Deploy v1.0.3 -->
</html>
