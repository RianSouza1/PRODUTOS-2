<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Calistenie Militară pentru Bărbați — Zona de membri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="core.css?v=2">
</head>

<body>

    <!-- ============ PRE-PAGE WELCOME SCREEN ============ -->
    <div id="pre-page" class="pre-page-overlay">
        <div class="pre-page-bg"></div>
        <div class="pre-page-content">
            <div class="pre-page-icon">🎖️</div>
            <h1>Calistenie Militară pentru Bărbați</h1>
            <p>Accesul tău premium a fost confirmat.<br>Începe astăzi programul de calistenie militară cu greutatea corpului pentru bărbați peste 50 de ani.</p>
            <div class="pre-page-features">
                <span>📖 Cărți</span>
                <span>🎬 Videoclipuri</span>
                <span>💬 Asistență</span>
            </div>
            <button onclick="let el=document.getElementById('pre-page'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',600);">
                Accesează programele →
            </button>
        </div>
    </div>

    <div id="floating-help-container"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-logo">
                <img src="assets/covers/man_IMG1_ro.png" alt="Calistenie Militară pentru Bărbați" id="brand-logo" onerror="this.style.display='none'">
                <h1 id="brand-title"></h1>
            </div>
        </header>

        <main id="app-root" class="main-content">
            <div class="loader-container">
                <i data-lucide="loader-2" class="spin-icon"></i>
            </div>
        </main>

        <nav class="bottom-tab-bar" id="main-nav">
            <a href="#carti" class="tab-item" data-tab="carti">
                <i data-lucide="book-open"></i>
                <span>Cărți</span>
            </a>
            <a href="#videoclipuri" class="tab-item" data-tab="videoclipuri">
                <i data-lucide="play-circle"></i>
                <span>Videoclipuri</span>
            </a>
            <a href="#asistenta" class="tab-item" data-tab="asistenta">
                <i data-lucide="message-square"></i>
                <span>Asistență</span>
            </a>
        </nav>
    </div>

    <script src="data.js?v=2"></script>
    <script src="app.js?v=2"></script>

</body>
<!-- Deploy v1.0.0 -->
</html>
